# Builds GitPilot installers on real Windows and Linux machines.
# Run it from the Actions tab ("Run workflow"), or push a tag like v0.1.0 to also publish a GitHub Release.
name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Windows (MSI + EXE)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Rust tests (Windows has not been verified before; failures are reported but don't block the installer)
        working-directory: src-tauri
        continue-on-error: true
        run: cargo test
      # Signs the installers when a certificate is stored in the repository secrets
      # WINDOWS_CERTIFICATE (base64 of a .pfx) and WINDOWS_CERTIFICATE_PASSWORD. See docs/CODE_SIGNING.md.
      - name: Build MSI and NSIS installers
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ($env:WINDOWS_CERTIFICATE) {
            $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
            Remove-Item $pfx
            $config = @{ bundle = @{ windows = @{
              certificateThumbprint = $cert.Thumbprint
              digestAlgorithm = "sha256"
              timestampUrl = "http://timestamp.digicert.com"
            } } } | ConvertTo-Json -Depth 5 -Compress
            Set-Content -Path "$env:RUNNER_TEMP\sign.json" -Value $config
            Write-Host "Signing with certificate $($cert.Subject)"
            npm run tauri build -- --bundles msi,nsis --config "$env:RUNNER_TEMP\sign.json"
          } else {
            Write-Host "::warning::No signing certificate configured, so the installers are unsigned (SmartScreen will warn)."
            npm run tauri build -- --bundles msi,nsis
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: gitpilot-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux:
    name: Linux (deb, AppImage, Arch/CachyOS)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev build-essential file \
            pacman-package-manager libarchive-tools zstd fakeroot
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test
      - working-directory: src-tauri
        run: cargo test
      - name: Build deb and AppImage
        run: npm run tauri build -- --bundles deb,appimage
      - name: Build Arch/CachyOS package
        run: |
          mkdir -p arch && cp packaging/arch/PKGBUILD arch/
          cp src-tauri/target/release/bundle/deb/*.deb arch/
          cd arch
          sed -i "s/^sha256sums=.*/sha256sums=('SKIP')/" PKGBUILD
          PKGEXT='.pkg.tar.zst' makepkg --nodeps --noconfirm -f
      - uses: actions/upload-artifact@v4
        with:
          name: gitpilot-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            arch/*.pkg.tar.zst
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
