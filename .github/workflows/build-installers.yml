# Builds GitPilot installers on real Windows and Linux machines.
# Run it from the Actions tab ("Run workflow"), or push a tag like v0.2.0 to also publish a GitHub Release.
#
# Optional repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD  → signed update packages + latest.json (in-app updates)
#   WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD              → Authenticode-signed Windows installers
#
# Optional repository variable (Settings → Secrets and variables → Actions → Variables):
#   GITPILOT_GITHUB_CLIENT_ID → client ID of a GitHub OAuth app with device flow enabled, built in
#                               for "Sign in with GitHub" (without it, users sign in with a token)
name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Windows (MSI + EXE)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # A failing Windows test stops the Windows installers from being built.
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
      - name: Build MSI and NSIS installers
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITPILOT_GITHUB_CLIENT_ID: ${{ vars.GITPILOT_GITHUB_CLIENT_ID }}
        run: |
          $config = @{ bundle = @{} }
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            $config.bundle.createUpdaterArtifacts = $true
            Write-Host "Update packages will be signed."
          } else {
            Write-Host "::warning::TAURI_SIGNING_PRIVATE_KEY is not set, so no update packages are produced (in-app updates won't find this build)."
          }
          if ($env:WINDOWS_CERTIFICATE) {
            $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
            Remove-Item $pfx
            $config.bundle.windows = @{
              certificateThumbprint = $cert.Thumbprint
              digestAlgorithm = "sha256"
              timestampUrl = "http://timestamp.digicert.com"
            }
            Write-Host "Signing installers with certificate $($cert.Subject)"
          } else {
            Write-Host "::warning::No code-signing certificate configured, so the installers are unsigned (SmartScreen will warn). See docs/CODE_SIGNING.md."
          }
          $file = Join-Path $env:RUNNER_TEMP "build-config.json"
          $config | ConvertTo-Json -Depth 6 -Compress | Set-Content -Path $file
          npm run tauri build -- --bundles msi,nsis --config "$file"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: gitpilot-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

  linux:
    name: Linux (deb, AppImage, Arch/CachyOS)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev build-essential file \
            pacman-package-manager libarchive-tools zstd fakeroot
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Bumped after a cached crates.io index crashed cargo ("Bus error"); bump again if it recurs.
          prefix-key: v1-rust
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test
      # A damaged crates.io index (e.g. restored from the cache) makes cargo die with SIGBUS
      # before compiling anything. Fetch first; on failure, drop the index and fetch again.
      - name: Download Rust dependencies
        working-directory: src-tauri
        run: |
          cargo fetch --locked || {
            echo "::warning::cargo fetch failed; retrying with a fresh crates.io index."
            rm -rf ~/.cargo/registry/index ~/.cargo/.package-cache
            cargo fetch --locked
          }
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
      - name: Build deb and AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITPILOT_GITHUB_CLIENT_ID: ${{ vars.GITPILOT_GITHUB_CLIENT_ID }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npm run tauri build -- --bundles deb,appimage --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set, so no update packages are produced."
            npm run tauri build -- --bundles deb,appimage
          fi
      - name: Build Arch/CachyOS package
        run: |
          mkdir -p arch && cp packaging/arch/PKGBUILD packaging/arch/LICENSE arch/
          cp src-tauri/target/release/bundle/deb/*.deb arch/
          cd arch
          # The .deb was just built, so its pinned checksum can't match; replace the whole list.
          perl -0pi -e "s/sha256sums=\([^)]*\)/sha256sums=('SKIP' 'SKIP')/s" PKGBUILD
          PKGEXT='.pkg.tar.zst' makepkg --nodeps --noconfirm -f
      - name: Sign the Arch package for in-app updates
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set, so the Arch package can't update itself."
            exit 0
          fi
          for f in arch/*.pkg.tar.zst; do npx tauri signer sign "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: gitpilot-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            arch/*.pkg.tar.zst
            arch/*.pkg.tar.zst.sig
          if-no-files-found: error

  update-manifest:
    name: Update manifest (latest.json)
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Build latest.json
        id: manifest
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if ! find dist -name '*.sig' | grep -q .; then
            echo "::warning::No signed update packages, so latest.json was not created."
            exit 0
          fi
          node scripts/make-latest-json.mjs dist "${{ github.repository }}" "$VERSION" latest.json
          echo "created=true" >> "$GITHUB_OUTPUT"
      - if: steps.manifest.outputs.created == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gitpilot-update-manifest
          path: latest.json

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, update-manifest]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the app version
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match version ${VERSION} in tauri.conf.json"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Installed copies look for updates at releases/latest/download/latest.json, which GitHub
      # serves only from the newest non-pre-release. Publish as a full release for updates to reach users.
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          files: |
            dist/**/*.msi
            dist/**/*.exe
            dist/**/*.deb
            dist/**/*.AppImage
            dist/**/*.pkg.tar.zst
            dist/**/latest.json
